name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # Gate: the full normal-target build/vet/test suite must pass before we ever
      # touch the release build or a GitHub Release. CGO_ENABLED=0 is explicit here
      # too, even though ubuntu-latest is already linux/amd64 — this guarantees no
      # cgo creeps in via a transitive dependency, which is the whole point of using
      # modernc.org/sqlite (pure Go) instead of mattn/go-sqlite3 (see CLAUDE.md).
      - name: Build (all packages)
        env:
          CGO_ENABLED: '0'
        run: go build ./...

      - name: Vet
        env:
          CGO_ENABLED: '0'
        run: go vet ./...

      - name: Test
        env:
          CGO_ENABLED: '0'
        run: go test ./...

      # Release artifact. deploy/install.sh downloads this exact asset name from
      # .../releases/latest/download/tgproxy-panel-linux-amd64 — do not rename it.
      - name: Build release binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w" -o tgproxy-panel-linux-amd64 ./cmd/tgproxy-panel

      - name: Checksum
        run: sha256sum tgproxy-panel-linux-amd64 > tgproxy-panel-linux-amd64.sha256

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            tgproxy-panel-linux-amd64
            tgproxy-panel-linux-amd64.sha256
