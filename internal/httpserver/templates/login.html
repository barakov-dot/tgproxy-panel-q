<!doctype html>
<html lang="ru" class="h-full">
<head>
{{template "head" .}}
</head>
<body class="flex h-full min-h-screen items-center justify-center bg-slate-50 dark:bg-slate-950">
  <div class="w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-8 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <h1 class="mb-1 text-lg font-semibold text-slate-900 dark:text-slate-100">tgproxy panel</h1>
    <p class="mb-6 text-sm text-slate-500 dark:text-slate-400">Вход для администратора</p>

    {{if .Error}}
    <div class="mb-4 rounded-lg bg-rose-50 px-3 py-2 text-sm text-rose-700 dark:bg-rose-400/10 dark:text-rose-400">
      {{.Error}}
    </div>
    {{end}}

    <form method="post" action="{{.Base}}/login" class="space-y-4">
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300" for="login">Логин</label>
        <input id="login" name="login" type="text" autocomplete="username" required
               class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100">
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300" for="password">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required
               class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100">
      </div>
      <button type="submit"
              class="w-full rounded-lg bg-indigo-600 px-3 py-2 text-sm font-semibold text-white hover:bg-indigo-500">
        Войти
      </button>
    </form>
  </div>
</body>
</html>
