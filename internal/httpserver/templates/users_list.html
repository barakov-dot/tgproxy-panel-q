<!doctype html>
<html lang="ru" class="h-full">
<head>
{{template "head" .}}
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950">
{{template "nav" .}}
<main class="mx-auto max-w-6xl px-4 py-8 sm:px-6">
  <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
    <h1 class="text-xl font-semibold text-slate-900 dark:text-slate-100">Пользователи</h1>
    <div class="flex items-center gap-2 text-sm">
      <a href="{{.Base}}/"
         class="rounded-lg px-3 py-1.5 font-medium {{if not .OnlyPending}}bg-indigo-600 text-white{{else}}text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800{{end}}">
        Все
      </a>
      <a href="{{.Base}}/?filter=pending"
         class="rounded-lg px-3 py-1.5 font-medium {{if .OnlyPending}}bg-indigo-600 text-white{{else}}text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800{{end}}">
        Ожидают{{if .PendingCount}} ({{.PendingCount}}){{end}}
      </a>
    </div>
  </div>

  <div class="mb-4">
    <input type="text" name="q" value="{{.Query}}" placeholder="Поиск по ID, имени, username, статусу…"
           hx-get="{{.Base}}/users/table?sort={{.Sort}}&dir={{.Dir}}{{if .OnlyPending}}&filter=pending{{end}}"
           hx-trigger="keyup changed delay:300ms, search"
           hx-target="#users-table-wrap" hx-swap="innerHTML" hx-push-url="true"
           class="w-full max-w-md rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100">
  </div>

  <div id="users-table-wrap">
    {{template "users_table.html" .}}
  </div>
</main>
</body>
</html>
